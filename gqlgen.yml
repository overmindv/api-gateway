schema:
  - api/graphql/schema.graphqls
exec:
  filename: internal/graphql/generated/generated.go
  package: generated
model:
  filename: internal/graphql/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: internal/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"
  # Реализации распределены между schema.resolvers.go и collection.resolvers.go.
  # Генератор обновляет интерфейсы, но не перезаписывает написанные resolver'ы.
  preserve_resolver: true
autobind: []
