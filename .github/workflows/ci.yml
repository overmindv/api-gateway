name: API Gateway CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt needed:" && gofmt -l . && exit 1)
      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build service
        run: make build

  # E2E-CI отключён
  # e2e:
  #   permissions:
  #     contents: read
  #   uses: overmindv/tests/.github/workflows/e2e.yml@main
  #   secrets: inherit
  #   with:
  #     target_repo: api-gateway


  schema:
    name: GraphQL contract
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: make schema-test generate-check
      - name: Compare with base schema
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$BASE_COMMIT"
          git show "$BASE_COMMIT:api/graphql/schema.graphqls" > "$RUNNER_TEMP/base.graphqls"
          make schema-check BASE_SCHEMA="$RUNNER_TEMP/base.graphqls"
      - run: make schema-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: graphql-schema-${{ github.sha }}
          path: dist/graphql-schema/
          if-no-files-found: error
          retention-days: 90
